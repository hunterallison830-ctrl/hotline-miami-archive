<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>HOTLINE MIAMI ARCHIVE // NIGHT CALL (fan mini-game)</title>
<meta name="description" content="A tiny original top-down mini-game inspired by Hotline Miami. Fan-made, non-commercial.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#ff2a8a"><link rel="icon" href="icons/icon-192.png">
<style>
html,body{-webkit-touch-callout:none;margin:0;height:100%;background:#160630;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;cursor:crosshair;image-rendering:pixelated}
.scan{position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.vig{position:fixed;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 140px #000b}
.back{position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));z-index:10;font:10px 'Press Start 2P';color:#16f4ff;text-decoration:none;border:2px solid #16f4ff;padding:0 12px;min-height:44px;min-width:110px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;background:#000a}
.touch{position:fixed;inset:0;z-index:8;display:none}
body.is-touch .touch{display:block}
.tbtn{position:absolute;right:calc(18px + env(safe-area-inset-right));bottom:calc(150px + env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;border:3px solid #ffe14d;background:#ffe14d22;color:#ffe14d;font:9px 'Press Start 2P';display:grid;place-items:center;box-shadow:0 0 14px #ffe14d88}
.tbtn.r{bottom:auto;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));font-size:11px;border-color:#16f4ff;color:#16f4ff;background:#16f4ff22;box-shadow:0 0 14px #16f4ff88;width:56px;height:56px}
.tbtn.pw{bottom:calc(236px + env(safe-area-inset-bottom));width:84px;height:84px;font-size:10px;color:#fff;border-color:#ff2a8a;background:conic-gradient(#ff2a8a99 var(--p,0%),#0008 0);box-shadow:0 0 10px #ff2a8a88;opacity:.75}
.tbtn.pw[data-st=ready]{opacity:1;border-color:#fff;background:#16f4ff55;animation:pwThrob .5s ease-in-out infinite alternate}
.tbtn.pw[data-st=on]{opacity:1;border-color:#fff;background:conic-gradient(#ffffffaa var(--p,0%),#0008 0);box-shadow:0 0 24px #16f4ff}
@keyframes pwThrob{from{transform:scale(1);box-shadow:0 0 14px #16f4ff}to{transform:scale(1.12);box-shadow:0 0 36px #fff,0 0 60px #16f4ff}}
@media (max-height:420px){.tbtn{bottom:calc(20px + env(safe-area-inset-bottom))}.tbtn.pw{bottom:calc(104px + env(safe-area-inset-bottom));width:76px;height:76px}}
.tbtn.r{width:46px;height:46px}.tbtn.p{right:calc(64px + env(safe-area-inset-right))}
.tbtn.r.arm{background:#ff2a8a;color:#000;border-color:#fff;animation:pwThrob .3s infinite alternate}
body[data-mode=select] .tbtn,body[data-mode=results] .tbtn:not(#tR),body[data-mode=paused] .tbtn{display:none}

/* phone controls: one move stick + ATTACK (big), THROW, POWER */
.tbtn.atk{right:calc(16px + env(safe-area-inset-right));bottom:calc(64px + env(safe-area-inset-bottom));width:96px;height:96px;font-size:10px;border-color:#ff2a8a;color:#fff;background:#ff2a8a33;box-shadow:0 0 18px #ff2a8a}
.tbtn.atk:active{background:#ff2a8a99}
#tThrow{right:calc(120px + env(safe-area-inset-right));bottom:calc(132px + env(safe-area-inset-bottom));width:64px;height:64px;font-size:8px}
#tPow{right:calc(22px + env(safe-area-inset-right));bottom:calc(172px + env(safe-area-inset-bottom));width:74px;height:74px}
@media (max-height:420px){.tbtn.atk{bottom:calc(14px + env(safe-area-inset-bottom));width:84px;height:84px}#tThrow{bottom:calc(10px + env(safe-area-inset-bottom));right:calc(110px + env(safe-area-inset-right))}#tPow{bottom:calc(108px + env(safe-area-inset-bottom));width:64px;height:64px;right:calc(26px + env(safe-area-inset-right))}}
/* death: big neon restart, controls hidden */
#deadBtn{display:none;position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) rotate(-2deg);z-index:12;min-height:56px;padding:12px 26px;font:clamp(12px,3.4vw,20px) 'Press Start 2P',monospace;color:#fff;background:#14031f;border:4px solid #ff2a8a;cursor:pointer;letter-spacing:1px;animation:dbGlow 1.6s linear infinite,dbPulse .55s ease-in-out infinite alternate;text-shadow:3px 3px 0 #ff2a8a,-2px -2px 0 #16f4ff;touch-action:manipulation}
body.dead #deadBtn{display:block}
body.dead .tbtn:not(.r){display:none}
#deadBtn .dt{display:none}body.is-touch #deadBtn .dt{display:inline}body.is-touch #deadBtn .dk{display:none}
@keyframes dbGlow{0%{border-color:#ff2a8a;box-shadow:0 0 22px #ff2a8a,inset 0 0 12px #ff2a8a}33%{border-color:#16f4ff;box-shadow:0 0 22px #16f4ff,inset 0 0 12px #16f4ff}66%{border-color:#ffe14d;box-shadow:0 0 22px #ffe14d,inset 0 0 12px #ffe14d}100%{border-color:#ff2a8a;box-shadow:0 0 22px #ff2a8a,inset 0 0 12px #ff2a8a}}
@keyframes dbPulse{to{transform:translateX(-50%) rotate(2deg) scale(1.07)}}
</style><link rel="stylesheet" href="aud.css"><style>.aud-wrap.g{left:auto;bottom:auto;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));z-index:10}body.is-touch .aud-wrap.g{top:calc(64px + env(safe-area-inset-top))}body[data-mode=paused] .aud-wrap.g{display:none}</style></head><body>
<canvas id="c" aria-label="Mini-game canvas. WASD to move, mouse to aim, click to attack, right-click or Space to throw or pick up, R to restart."></canvas>
<div id="sab" style="position:fixed;bottom:0;left:0;width:0;height:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none"></div><div class="vig"></div><button id="deadBtn" type="button"><span class="dk">PRESS R TO RESTART</span><span class="dt">TAP TO RESTART</span></button><div class="scan"></div>
<a class="back" href="index.html">◂ ARCHIVE</a><div class="aud-wrap g" id="audCtl"><button class="aud" id="tMute" type="button" aria-label="Sound effects on/off (N). Music: B or pause menu. Volume: - and +"></button></div>
<div class="touch" id="touch"><div class="tbtn pw" id="tPow">POWER</div><div class="tbtn atk" id="tAtk">ATTACK</div><div class="tbtn" id="tThrow">THROW</div><div class="tbtn r" id="tR" aria-label="Restart (tap twice)">R</div><div class="tbtn r p" id="tP" aria-label="Pause">II</div></div>
<script src="aud.js"></script><script src="gameaudio.js"></script><script src="game.js"></script>
</body></html>
